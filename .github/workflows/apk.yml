name: Gerar app Android

# Gera o app Android (APK) do Preço Certo e publica em "Releases".
# Roda sozinho quando este arquivo é enviado, ou manualmente na aba Actions.
on:
  push:
    paths:
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar o projeto Android
        run: |
          mkdir -p android/app/src/main/java/br/preco/certo
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PrecoCerto'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'br.preco.certo'
              compileSdk 34
              defaultConfig {
                  applicationId 'br.preco.certo'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Preço Certo"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/br/preco/certo/MainActivity.java <<'EOF'
          package br.preco.certo;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Message;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          // Janela do app: mostra o Preço Certo e manda os links dos mercados para o navegador do celular.
          public class MainActivity extends Activity {
              private static final String HOME = "https://rdeb1986.github.io/preco-certo/";
              private static final String HOST = "rdeb1986.github.io";
              private WebView web;

              @Override
              protected void onCreate(Bundle estado) {
                  super.onCreate(estado);
                  getWindow().setStatusBarColor(Color.parseColor("#14532d"));
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setSupportMultipleWindows(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          abrirNoNavegador(u);
                          return true;
                      }
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (!r.isForMainFrame()) return;
                          String h = "<html><body style='font-family:sans-serif;padding:24px'>"
                              + "<h3>Não consegui abrir o Preço Certo</h3>"
                              + "<p>Motivo: " + e.getDescription() + " (código " + e.getErrorCode() + ")</p>"
                              + "<p><a href='" + HOME + "'>Tentar de novo</a></p></body></html>";
                          v.loadDataWithBaseURL("https://" + HOST + "/erro", h, "text/html", "utf-8", null);
                      }
                  });

                  // Links que pedem "nova guia" (target=_blank) também vão para o navegador
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView v, boolean dialog, boolean gesto, Message msg) {
                          WebView temp = new WebView(MainActivity.this);
                          temp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView w, WebResourceRequest r) {
                                  abrirNoNavegador(r.getUrl());
                                  return true;
                              }
                              @Override
                              public void onPageStarted(WebView w, String url, Bitmap icone) {
                                  if (url != null && !url.equals("about:blank")) {
                                      w.stopLoading();
                                      abrirNoNavegador(Uri.parse(url));
                                  }
                              }
                          });
                          WebView.WebViewTransport t = (WebView.WebViewTransport) msg.obj;
                          t.setWebView(temp);
                          msg.sendToTarget();
                          return true;
                      }
                  });

                  if (estado == null) web.loadUrl(HOME); else web.restoreState(estado);
              }

              private void abrirNoNavegador(Uri u) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (Exception e) {
                      // sem navegador instalado: não faz nada
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle saida) {
                  super.onSaveInstanceState(saida);
                  web.saveState(saida);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Compilar o app
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publicar o app em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PrecoCerto.apk
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest PrecoCerto.apk \
            --title "App Preço Certo (Android)" \
            --notes "Baixe o PrecoCerto.apk e instale no celular."
